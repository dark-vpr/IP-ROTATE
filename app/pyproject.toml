[project]
name = "ip-rotator"
version = "3.2.0"
description = "Production-grade IP-rotation gateway with HTTP/2 support, massive IP diversity (WARP+, v2ray), strict no-reuse windows, and zero-fail architecture for high-throughput scraping."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ip-rotator" }]
keywords = ["proxy", "socks5", "rotation", "scraping", "burp", "burpsuite", "http2", "warp", "v2ray"]
dependencies = [
    "httpx[http2,socks]>=0.27",  # HTTP/2 + SOCKS support for modern targets
    "python-socks>=2.4",         # battle-tested SOCKS4/4a/5 client
    "rich>=13.7",                # terminal output for CLI
    "aiohttp>=3.9.0",            # async HTTP for high-concurrency scenarios
    "async-timeout>=4.0.0",      # timeout management for async operations
]

[dependency-groups]
dev = [
    "pytest>=8.0",             # test suite: uv sync installs it; run via `uv run pytest tests/ -q`
]

[project.scripts]
ip-rotator = "ip_rotator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ip_rotator"]

[tool.uv]
# `uv sync` / `uv run` workflow is the primary supported way to run this tool
package = true
