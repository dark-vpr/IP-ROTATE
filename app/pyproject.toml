[project]
name = "ip-rotator"
version = "3.1.0"
description = "Free & freemium (no credit card) self-healing IP-rotation gateway: HTTP CONNECT + SOCKS5 frontends for curl / Burp Suite, never-reuse egress ledger, per-request failover."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ip-rotator" }]
keywords = ["proxy", "socks5", "rotation", "scraping", "burp", "burpsuite"]
dependencies = [
    "httpx[socks]>=0.27",      # world-class HTTP client (harvest + TLS-verified validation)
    "python-socks>=2.4",       # battle-tested SOCKS4/4a/5 client (upstream tunnels)
    "rich>=13.7",              # best-in-class terminal output for doctor/test/status
]

[dependency-groups]
dev = [
    "pytest>=8.0",             # test suite: uv sync installs it; run via `uv run pytest tests/ -q`
]

[project.scripts]
ip-rotator = "ip_rotator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ip_rotator"]

[tool.uv]
# `uv sync` / `uv run` workflow is the primary supported way to run this tool
package = true
