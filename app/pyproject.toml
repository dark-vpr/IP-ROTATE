[project]
name = "ip-rotator"
version = "4.1.0"
description = "Ultimate IP Rotator with God Mode WAF Bypass"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28.0",
    "aiohttp>=3.11.0",
    "curl-cffi>=0.9.0",
    "playwright>=1.49.0",
    "playwright-stealth>=1.0.0",
    "rich>=14.0.0",
    "pytest>=8.3.0",
    "websockets>=14.0",
    "pysocks>=1.7.1",
    "python-socks>=2.5.0",
    "cryptography>=44.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ip_rotator"]

[project.scripts]
ip-rotator = "ip_rotator.cli:main"
